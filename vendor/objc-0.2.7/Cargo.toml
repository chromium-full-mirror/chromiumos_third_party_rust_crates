[package]
name = "objc"
version = "0.2.7"
authors = [
    "Steven Sheldon",
]
exclude = [
    ".gitignore",
    ".travis.yml",
    "doc.sh",
    "travis_install.sh",
    "travis_test.sh",
    "tests-ios/**",
]
description = "Empty crate that should not build."
documentation = "http://ssheldon.github.io/rust-objc/objc/"
