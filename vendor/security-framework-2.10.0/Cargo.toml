example = [
    { name = "client" },
    { name = "find_internet_password" },
    { name = "set_internet_password" },
]

[package]
edition = "2021"
rust-version = "1.60"
name = "security-framework"
version = "2.10.0"
authors = [
    "Steven Fackler <sfackler@gmail.com>",
    "Kornel <kornel@geekhood.net>",
]
exclude = [
    "test/*",
]
description = "Empty crate that should not build."
homepage = "https://lib.rs/crates/security_framework"
documentation = "https://docs.rs/security_framework"
readme = "README.md"
keywords = [
    "iOS",
    "TLS",
    "SSL",
    "crypto",
    "keychain",
]
categories = [
    "os::macos-apis",
    "cryptography",
    "api-bindings",
]
license = "Apache-2.0"
repository = "https://github.com/kornelski/rust-security-framework"

[package.metadata.docs.rs]
features = [
    "OSX_10_15",
]
targets = [
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
]

[features]
OSX_10_10 = []
OSX_10_11 = []
OSX_10_12 = []
OSX_10_13 = []
OSX_10_14 = []
OSX_10_15 = []
OSX_10_9 = []
alpn = []
default = []
job-bless = []
nightly = []
serial-number-bigint = []
session-tickets = []

[badges.maintenance]
status = "looking-for-maintainer"

[lints.clippy]
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
if_not_else = "allow"
inline_always = "allow"
items_after_statements = "allow"
iter_not_returning_iterator = "allow"
map_unwrap_or = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
redundant_closure_for_method_calls = "allow"
similar_names = "allow"
unnested_or_patterns = "allow"
wildcard_imports = "allow"

[lints.clippy.pedantic]
level = "warn"
priority = -100
