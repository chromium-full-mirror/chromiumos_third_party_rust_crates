[package]
edition = "2021"
rust-version = "1.71"
name = "windows-link"
version = "0.1.1"
authors = [
    "Microsoft",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Empty crate that should not build."
readme = "readme.md"
license = "Apache-2.0"
repository = "https://github.com/microsoft/windows-rs"

[lib]
name = "windows_link"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.rust.rust_2018_idioms]
level = "warn"
priority = -1

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(windows_raw_dylib, windows_debugger_visualizer, windows_slim_errors)",
]
