[package]
edition = "2021"
rust-version = "1.63"
name = "getrandom"
version = "0.3.3"
authors = [
    "The Rand Project Developers",
]
exclude = [
    ".*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Empty crate that should not build."
documentation = "https://docs.rs/getrandom"
readme = "README.md"
categories = [
    "os",
    "no-std",
]
license = "Apache-2.0"
repository = "https://github.com/rust-random/getrandom"

[package.metadata.cross.target.x86_64-unknown-netbsd]
pre-build = [
    "mkdir -p /tmp/netbsd",
    "curl -fO https://cdn.netbsd.org/pub/NetBSD/NetBSD-9.3/amd64/binary/sets/base.tar.xz",
    "tar -C /tmp/netbsd -xJf base.tar.xz",
    "cp /tmp/netbsd/usr/lib/libexecinfo.so /usr/local/x86_64-unknown-netbsd/lib",
    "rm base.tar.xz",
    "rm -rf /tmp/netbsd",
]

[package.metadata.docs.rs]
features = [
    "std",
]

[features]
rustc-dep-of-std = []
std = []
wasm_js = []

[lib]
name = "getrandom"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(getrandom_backend, values(\"custom\", \"efi_rng\", \"rdrand\", \"rndr\", \"linux_getrandom\", \"linux_raw\", \"wasm_js\"))",
    "cfg(getrandom_msan)",
    "cfg(getrandom_windows_legacy)",
    "cfg(getrandom_test_linux_fallback)",
    "cfg(getrandom_test_linux_without_fallback)",
    "cfg(getrandom_test_netbsd_fallback)",
    "cfg(target_os, values(\"cygwin\"))",
]
