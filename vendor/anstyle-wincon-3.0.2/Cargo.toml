[package]
edition = "2021"
rust-version = "1.70.0"
name = "anstyle-wincon"
version = "3.0.2"
description = "Empty crate that should not build."
homepage = "https://github.com/rust-cli/anstyle"
readme = "README.md"
keywords = [
    "ansi",
    "terminal",
    "color",
    "windows",
]
categories = [
    "command-line-interface",
]
license = "Apache-2.0"
repository = "https://github.com/rust-cli/anstyle.git"

[package.metadata.docs.rs]
features = []
rustdoc-args = [
    "--cfg",
    "docsrs",
]
targets = [
    "x86_64-pc-windows-msvc",
]

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
min = 1
replace = "{{version}}"
search = "Unreleased"

[[package.metadata.release.pre-release-replacements]]
exactly = 1
file = "CHANGELOG.md"
replace = "...{{tag_name}}"
search = "\\.\\.\\.HEAD"

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
min = 1
replace = "{{date}}"
search = "ReleaseDate"

[[package.metadata.release.pre-release-replacements]]
exactly = 1
file = "CHANGELOG.md"
replace = "<!-- next-header -->\n## [Unreleased] - ReleaseDate\n"
search = "<!-- next-header -->"

[[package.metadata.release.pre-release-replacements]]
exactly = 1
file = "CHANGELOG.md"
replace = "<!-- next-url -->\n[Unreleased]: https://github.com/rust-cli/anstyle/compare/{{tag_name}}...HEAD"
search = "<!-- next-url -->"
