[package]
edition = "2018"
name = "combine"
version = "4.6.7"
authors = [
    "Markus Westerlind <marwes91@gmail.com>",
]
description = "Empty crate that should not build."
documentation = "https://docs.rs/combine"
readme = "README.md"
keywords = [
    "parser",
    "parsing",
    "combinators",
    "ll",
]
categories = [
    "parsing",
    "no-std",
]
license = "Apache-2.0"
repository = "https://github.com/Marwes/combine"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[profile.bench]
lto = true
codegen-units = 1

[lib]
name = "combine"

[[example]]
name = "async"
required-features = [
    "std",
    "tokio",
]

[[example]]
name = "date"

[[example]]
name = "number"

[[example]]
name = "readme"

[[example]]
name = "ini"

[features]
alloc = []
default = []
futures-03 = []
mp4 = []
pin-project = []
std = []
tokio = []
tokio-02 = []
tokio-03 = []
