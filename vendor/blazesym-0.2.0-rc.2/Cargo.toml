[package]
edition = "2021"
rust-version = "1.69"
name = "blazesym"
version = "0.2.0-rc.2"
authors = [
    "Daniel Müller <deso@posteo.net>",
    "Kui-Feng <thinker.li@gmail.com>",
]
build = "build.rs"
exclude = ["data/kallsyms.xz"]
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "blazesym is a library for address symbolization and related tasks."
readme = "README.md"
keywords = [
    "dwarf",
    "elf",
    "gsym",
    "stacktrace",
    "tracing",
]
categories = [
    "algorithms",
    "api-bindings",
    "development-tools::debugging",
    "os::unix-apis",
    "value-formatting",
]
license = "BSD-3-Clause"
repository = "https://github.com/libbpf/blazesym"

[package.metadata.docs.rs]
