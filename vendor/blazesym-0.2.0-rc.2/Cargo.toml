    "apk",
    "backtrace",
    "breakpad",
    "demangle",
    "dwarf",
    "gsym",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[profile.bench]
lto = false
codegen-units = 256

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 2

[lib]
name = "blazesym"
path = "src/lib.rs"

