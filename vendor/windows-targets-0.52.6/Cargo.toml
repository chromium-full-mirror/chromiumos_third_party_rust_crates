[package]
edition = "2021"
rust-version = "1.56"
name = "windows-targets"
version = "0.52.6"
authors = [
    "Microsoft",
]
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Empty crate that should not build."
readme = "readme.md"
license = "Apache-2.0"
repository = "https://github.com/microsoft/windows-rs"

[lib]
name = "windows_targets"

[lints.rust]
missing_docs = "warn"

[lints.rust.rust_2018_idioms]
level = "warn"
priority = -1

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(windows_raw_dylib, windows_debugger_visualizer, windows_slim_errors)",
]
