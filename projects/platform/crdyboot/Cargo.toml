[package]
name = "crdyboot"
version = "1.0.0"
authors = ["The Chromium OS Authors"]
edition = "2021"

[dependencies]
log = "0.4"
object = { version = "0.29.0", default-features = false, features = ["pe", "read_core", "unaligned"] }
printf-compat = { version = "0.1", default-features = false }
uefi = { version = "0.20", default-features = false, features = ["alloc"] }
uefi-services = "0.17"
uguid = "1.0"

[dev-dependencies]
regex = "1.6.0"

[build-dependencies]
bindgen = "0.63.0"
