[package]
name = "crosvm"
version = "0.1.0"
authors = ["The Chromium OS Authors"]
edition = "2021"

[dependencies]
anyhow = "1.0.32"
argh = "0.1.10"
async-task = "4"
async-trait = "0.1.36"
bindgen = "0.63"
bitflags = "2.2.1"
bitreader = "0.3.6"
bytes = "1.1"
cbindgen = "0.24"
cc = "1.0.25"
cfg-if = "1"
ciborium = "0.2.2"
chrono = "0.4.34"
com_logger = "0.1"
crc32fast = "1.2"
cros-codecs-0-0-4 = { package = "cros-codecs", version = "0.0.4", features = [
    "vaapi",
] }
crossbeam-utils = "0.8"
ctrlc = "3.2"
dbus = "0.9"
document-features = "0.2"
downcast-rs = "1.2"
enumn = "0.1"
env_filter = "1.0"
env_logger = "0.11"
euclid = "0.22.7"
fnv = "1"
futures = "0.3"
futures-executor = { version = "0.3", features = ["thread-pool"] }
futures-util = "0.3"
gdbstub = "0.7.0"
gdbstub_arch = "0.3.0"
intrusive-collections = "0.9"
io-uring = { version = "0.5", features = ["unstable"] }
lazy_static = "1.4"
libc = "0.2.153"
# TODO: Remove this `=` constraint. It matches what crosvm currently has.
libfuzzer-sys = "=0.4.4"
libslirp-sys = "4.2.1"
libtest-mimic = "0.6.0"
log = "0.4"
lz4_flex = "0.11"
memoffset = "0.6"
merge = "0.1.0"
mio = { version = "0.7", features = ["os-ext"] }
named-lock = "0.3"
nix = { version = "0.28", features = ["event", "feature", "fs", "mman", "socket", "uio", "ioctl"] }
nom = "7.1"
num = "0.2"
num_cpus = "1"
num-traits = "0.2"
once_cell = "1.7.2"
p9 = "0.2.3"
paste = "1"
pcap-file = "1.1"
pin-utils = "0.1.0-alpha.4"
pkg-config = "0.3.11"
proc-macro2 = "1"
protobuf = "3.2"
protobuf-codegen = "3.2"
quote = "1"
rand = "0.9.2"
rand_core = { version = "0.6", features = ["std"] }
rayon = "1"
regex = "1"
remain = "0.2"
rustix = { version = "1.0.7", features = ["event", "fs", "mm", "net", "param", "pipe", "use-libc", "use-libc-auxv", "libc_errno"] }
rutabaga_gfx = "=0.1.76-chromeos"
scudo = "0.1.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
shlex = "1.3"
slab = "0.4"
smallvec = "1.6.1"
static_assertions = "1.1"
syn = { version = "2", features = ["extra-traits", "full"] }
tempfile = "3"
thiserror = "1.0.20"
url = "2.3"
userfaultfd = "0.8.1"
uuid = { version = "1", features = ["v4", "serde"] }
virtio-media = "0.0.8"
which = "4.3"
zerocopy = { version = "0.7", features = ["derive"] }
zerocopy_0_8 = { package = "zerocopy", version = "0.8", features = ["derive"] }

# Any dependencies added here will be replaced with empty crates as they won't actually
# be used in ChromeOS builds. Bonus: No `cargo vet` review needed either.
[target.'cfg(windows)'.dependencies]
vulkano = "0.31.1"
vulkano_0_33 = { package = "vulkano", version = "0.33.0" }
winapi = "0.3"
windows = "0.61.1"
wio = "0.2"
wmi = "0.9"

[target.'cfg(target_os = "android")'.dependencies]
android_log-sys = "0.3.1"
