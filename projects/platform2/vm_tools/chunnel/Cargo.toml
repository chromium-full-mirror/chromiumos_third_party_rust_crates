[package]
name = "chunnel"
version = "0.1.0"
authors = ["The Chromium OS Authors"]
edition = "2018"

[dependencies]
dbus = "0.9"
dbus-tree = "0.9"
getopts = "0.2"
libc = "0.2"
log = "0.4"
nix = { version = "0.29", features = ["signal"] }
protobuf = "3.2"
remain = "0.2"
vsock = "0.5"

[build-dependencies]
protobuf-codegen = "3.2"

[dev-dependencies]
tempfile = "3"
