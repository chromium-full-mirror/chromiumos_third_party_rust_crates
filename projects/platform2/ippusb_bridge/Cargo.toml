[package]
name = "ippusb_bridge"
version = "0.1.0"
authors = ["The Chromium OS Authors"]
edition = "2021"

[dependencies]
chunked_transfer = "1"
dbus = "0.9"
getopts = "0.2.18"
httparse = "1.3.4"
hyper = { version = "0.14", features = ["http1", "server", "runtime", "tcp", "backports", "deprecated"]}
ippusb = "0.5.0"
libc = "0.2.44"
log = "0.4"
rusb = "0.9.4"
syslog = "6.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "io-util", "macros", "signal"] }
