[package]
name = "resourced"
version = "0.1.0"
authors = ["The Chromium OS Authors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
dbus = "0.9"
dbus-crossroads = "0.5.0"
dbus-tokio = "0.7.5"
glob = "0.3"
libc = "0.2"
log = "0.4"
once_cell = "1.7"
procfs = "0.15"
protobuf = "3.2"
regex = "1.5"
tempfile = "3.0.2"
tokio = { version = "1.29.1", features = ["macros", "rt", "time"] }
