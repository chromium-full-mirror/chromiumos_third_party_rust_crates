[package]
name = "hiberman"
version = "0.1.0"
authors = ["The Chromium OS Authors"]
edition = "2018"

[dependencies]
anyhow = "1.0.0"
dbus = "0.9"
dbus-crossroads = "0.5.0"
ext2 = "0.1.1"
getopts = "0.2"
kernlog = "0.3"
libc = "0.2.93"
log = { version = "0.4", features = ["std", "serde"] }
once_cell = "1.7"
openssl = "0.10.36"
protobuf = "3.2"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
syslog = "6.0.1"
syslog_rfc5424 = "0.9.0"
thiserror = "1.0.20"
zeroize = { version = "1.5.1", features = ["zeroize_derive"] }
