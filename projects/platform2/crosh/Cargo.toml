[package]
name = "crosh"
version = "0.24.52"
authors = ["The Chromium OS Authors"]
edition = "2018"

[dependencies]
anyhow = "1.0.75"
bitflags = "1.3.2"
chrono = "0.4"
dbus = { version = "0.9.7", features = ["stdfd"] }
getopts = "0.2"
libc = "0.2.44"
log = "0.4"
nix = { version = "0.29", features = ["event", "signal"] }
protobuf = "3.2"
rand = "0.7"
remain = "*"
regex = "1.0.6"
rustyline = "9.1.1"
shell-words = "1.0.0"
signal-hook-registry = "*"
syslog = "6.0.1"
textwrap = "0.11.0"

[dev-dependencies]
tempfile = "3.2.0"
