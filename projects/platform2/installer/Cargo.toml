[package]
name = "chromeos-installer"
version = "0.1.0"
authors = ["The ChromiumOS Authors"]
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5.4", features = ["derive"] }
fs-err = "3.0.0"
glob = "0.3"
log = { version = "0.4", features = ["std"] }
nix = { version = "0.28.0", features = ["mount", "user"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
mockall = "0.12.1"
tempfile = "3.10"
