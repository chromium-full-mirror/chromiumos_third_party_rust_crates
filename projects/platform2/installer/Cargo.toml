[package]
name = "chromeos-installer"
version = "0.1.0"
authors = ["The ChromiumOS Authors"]
edition = "2021"

[dependencies]
anyhow = "1.0"
nix = { version = "0.28.0", features = ["user"] }
clap = { version = "4.5.4", features = ["derive"] }
log = { version = "0.4", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
mockall = "0.12.1"
tempfile = "3.10"
