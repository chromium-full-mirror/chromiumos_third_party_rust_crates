[package]
name = "ectool-deps"
version = "0.1.0"
authors = ["The ChromiumOS Authors"]
edition = "2024"

[dependencies]
anyhow = "1.0"
arrayvec = "0.7"
bitflags = "2"
bitvec = "1.0"
bytemuck = { version = "1.13", features = ["derive"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crc32fast = "1.3"
ctrlc = "3.4"
env_logger = "0.11"
hex = "0.4"
humantime = "2.1"
libc = "0.2"
log = "0.4"
memchr = "2.7"
nix = { version = "0.29", features = ["fs", "ioctl"] }
num-derive = "0.4"
num-traits = "0.2"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
paste = "1.0"
rand = "0.9"
regex = "1"
scopeguard = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
thiserror = "2.0"
zerocopy = { version = "0.8", features = ["derive"] }

[build-dependencies]
bindgen = "0.72.1"
