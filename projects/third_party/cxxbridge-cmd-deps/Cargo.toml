[package]
name = "cxxbridge-cmd-deps"
version = "0.1.0"
authors = ["The ChromiumOS Authors"]
edition = "2018"

[dependencies]
# Since cxxbridge-cmd doesn't have a library target, `cargo metadata` (probably
# among other tools) will consider it an invalid dependency. Hence, have it as a
# dependency here so `cargo vendor` will pull it in, but also mirror its
# dependencies so `cargo metadata` will correctly account for their liveness.
cxxbridge-cmd = "1.0.194"

# Copied directly from cxxbridge-cmd's Cargo.toml.
[dependencies.clap]
version = "4"
features = [
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
]
default-features = false

[dependencies.codespan-reporting]
version = "0.11"

[dependencies.proc-macro2]
version = "1.0.39"
features = ["span-locations"]
default-features = false

[dependencies.quote]
version = "1.0"
default-features = false

[dependencies.syn]
version = "2.0.1"
features = [
    "parsing",
    "printing",
    "clone-impls",
    "full",
]
default-features = false
