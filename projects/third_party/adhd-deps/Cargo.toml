[package]
name = "adhd-deps"
version = "0.1.0"
authors = ["The ChromiumOS Authors"]
edition = "2018"

[dependencies]
alsa-sys = "0.2.0"
anyhow = "1.0.70"
assert_matches = "1.5.0"
async-trait = "0.1.36"
bindgen = "0.63.0"
bitflags = "2.4.0"
cbindgen = "0.24.0"
cc = "1.0.73"
cfg-if = "1.0.0"
clap = { version = "4.5.4", features = ["derive"] }
dasp_sample = "0.11.0"
dbus = "0.9.0"
dbus-tokio = "0.7.6"
either = "1.9.0"
fixedbitset = "0.4.2"
futures = "0.3.28"
getopts = "0.2.0"
getrandom = "0.2.7"
glob = "0.3.0"
hound = "3.4.0"
itertools = "0.11.0"
libc = "0.2.124"
log = "0.4.17"
nix = "0.26.2"
once_cell = "1.17.0"
openssl = "0.10.48"
proc-macro2 = "1.0.0"
protobuf = "3.2.0"
protobuf-codegen = "3.2.0"
protobuf-parse = "3.2.0"
quote = "1.0.0"
regex = "1.6.0"
remain = "0.2.1"
rustfft = "6.1.0"
serde = { version = "1.0.52", features = ["derive"] }
serde_json = "1.0.96"
serde_yaml = "0.8.11"
syn = "1.0.0"
syslog = "6.0.1"
tempfile = "3.4.0"
thiserror = "1.0.30"
tokio = { version = "1.19.2", features = ["net", "rt", "time"] }

# These are alreaday audited but not currently in use.
# List them here to pin them.
dasp_frame = "0.11.0"
dasp_interpolate = "0.11.0"
