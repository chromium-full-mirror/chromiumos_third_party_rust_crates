[package]
name = "adhd-deps"
version = "0.1.0"
authors = ["The ChromiumOS Authors"]
edition = "2018"

[dependencies]
alsa-sys = "0.2"
anyhow = "1.0.68"
assert_matches = "1.5.0"
async-trait = "0.1.36"
clap = { version = "3.1.10", features = ["derive"] }
dasp_sample = "0.11"
dasp_frame = "0.11"
dasp_interpolate = "0.11"
dbus = "0.9"
futures = "*"
getopts = "0.2"
getrandom = "0.2.7"
hound = "3.4.0"
libc = "0.2.124"
log = "0.4.17"
nix = "0.26.2"
openssl = "0.10.48"
proc-macro2 = "^1"
protobuf = "3.2.0"
protobuf-codegen = "3.2.0"
quote = "^1"
remain = "0.2.1"
serde = { version = "1.0.125", features = ["derive"] }
serde_json = "1.0.64"
serde_yaml = "0.8.11"
syn = "1"
syslog = "6.0.1"
thiserror = "1.0.30"
