[package]
name = "thinp"
version = "1.0.13"
authors = ["Joe Thornber <ejt@redhat.com>"]
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
atty = "0.2"
anyhow = "1.0"
base64 = "0.22"
byteorder = "1.4"
clap = { version = "4.5", default-features = false, features = [
  "std",
  "help",
  "usage",
  "error-context",
  "suggestions",
] }
crc32c = "0.6"
data-encoding = "2.5"
exitcode = "1.1.2"
fixedbitset = "0.4"
flate2 = "1.0"
iovec = "0.1"
indicatif = "0.17"
libc = "0.2"
nom = "7.1"
num_cpus = "1.16"
num-derive = "0.4"
num-traits = "0.2"
quick-xml = "0.36"
rand = "0.8"
rangemap = "1.5"
roaring = "0.10"
safemem = "0.3"
threadpool = "1.8"
thiserror = "1.0"
