[package]
name = "aconfig"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
# aconfig
anyhow = "1.0.69"
itertools = "0.10.5"
protobuf = "3.2.0"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.93"
tinytemplate = "1.2.1"

# aconfig_protos
paste = "1.0.11"

# aconfig_storage_file
tempfile = "3.9.0"
thiserror = "1.0.56"

# aconfig_storage_read_api
memmap2 = "0.8.0"
once_cell = "1.19.0"
cxx = "1.0"

# aflags
regex = "1.10.3"
nix = { version = "0.28.0", features = ["user"] }
clap = {version = "4.5.2" }

#[build-dependencies]
# aconfig_storage_file
protobuf-codegen = "3.2.0"
cxx-build = "1.0"
