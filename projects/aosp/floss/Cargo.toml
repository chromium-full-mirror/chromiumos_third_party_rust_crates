[package]
name = "floss"
version = "0.0.1"
edition = "2024"
license = "BSD-Google"

[dependencies]
base64 = "0.13.0"
bindgen = { version = "0.72.1" }
bytes = "1.0"
configparser = "3.0.0"
cxx = { version = "1.0.194", features = ["c++17"] }
dbus = "0.9.2"
dbus-crossroads = "0.4.0"
dbus-tokio = "0.7.6"
env_logger = "0.8.3"
futures = "0.3.13"
glob = "0.3.0"
grpcio = { version = "0.13", features = ["protobuf", "protobuf-codec", "openssl"] }
grpcio-sys = { version = "0.13", features = ["openssl"] }
grpcio-compiler = "0.13"

hex = "0.4.3"
inotify = "0.9"
log = "0.4"
log-panics = { version = "2", features = ["with-backtrace"]}
nix = { version = "0.29", features = ["socket", "uio"] }
num-derive = "0.4.2"
num-traits = "0.2"
paste = "1.0"

pdl-compiler = "0.2.2"
pdl-runtime = "0.2.2"

proc-macro2 = "1.0.29"
protobuf = "3.2"
protoc-grpcio = "3.0"
protoc-rust = "2.28"
quote = "1.0.8"
rand = "0.8.3"
rustyline = "10"
rustyline-derive = "0.4.0"
thiserror = "1.0.23"
serde_json = "1.0"
shell-words = "1.1.0"
syn = { version = "1.0", features = ['default', 'full'] }
syslog = "6"
tokio = { version = "1.0", features = ['bytes', 'fs', 'io-util', 'libc', 'macros', 'mio', 'net', 'num_cpus', 'rt', 'rt-multi-thread', 'sync', 'time', 'tokio-macros'] }
tokio-stream = "0.1"
walkdir = "2.2"
uhid-virt = "0.0.6"

[target.'cfg(android)'.dependencies]
jni = "*"
