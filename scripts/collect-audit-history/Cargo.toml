[package]
name = "collect-audit-history"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
panic = "abort"

[dependencies]
anyhow = "1.0.70"
cargo-lock = "10"
chrono = "0.4.24"
clap = { version = "4", features = ["derive"] }
csv = "1"
rayon = "1"
serde = { version = "1.0.160", features = ["derive"] }
toml = "0.7"
